<header class="page-header">
  <div class="page-heading">
    <h1>{{ title() }}</h1>

    @if (subtitle()) {
      <p>{{ subtitle() }}</p>
    }
  </div>

  @if (actionLabel()) {
    <button
      type="button"
      class="action-button"
      (click)="action.emit()"
    >
      {{ actionLabel() }}
    </button>
  }
</header>
