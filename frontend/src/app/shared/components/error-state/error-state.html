<section
  class="state"
  role="alert"
  aria-live="assertive"
>
  <div
    class="state-icon"
    aria-hidden="true"
  >
    !
  </div>

  <h2>{{ title() }}</h2>

  <p>{{ message() }}</p>

  <button
    type="button"
    class="retry-button"
    (click)="retry.emit()"
  >
    {{ retryLabel() }}
  </button>
</section>
